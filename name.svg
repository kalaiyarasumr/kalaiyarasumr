<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');
      
      .text {
        font: 700 48px 'Inter', sans-serif;
        fill: url(#grad);
        animation: pulse 2s infinite ease-in-out, data-stream 5s infinite;
        letter-spacing: 1px;
      }

      @keyframes pulse {
        0%, 100% {
          text-shadow: 0 0 8px rgba(37, 99, 235, 0.5);
        }
        50% {
          text-shadow: 0 0 15px rgba(124, 58, 237, 0.7);
        }
      }

      @keyframes data-stream {
        0% {
          opacity: 0.95;
        }
        1% {
          opacity: 0.8;
        }
        2% {
          opacity: 1;
        }
        3% {
          opacity: 0.9;
        }
        4% {
          opacity: 1;
        }
        100% {
          opacity: 0.95;
        }
      }

      .tech-dot {
        fill: #3b82f6;
        opacity: 0;
        animation: dot-appear 6s infinite;
      }

      @keyframes dot-appear {
        0%, 10%, 20%, 100% {
          opacity: 0;
          transform: scale(0.5);
        }
        5%, 15% {
          opacity: 0.7;
          transform: scale(1);
        }
      }

      .circuit-line {
        stroke: #3b82f6;
        stroke-width: 1;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: draw 3s infinite;
        opacity: 0.3;
      }

      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </defs>

  <!-- Circuit board lines background -->
  <path class="circuit-line" d="M50,20 L200,20" />
  <path class="circuit-line" d="M600,130 L750,130" />
  <path class="circuit-line" d="M400,40 L400,90" />

  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" class="text">
    KALAIYARASU M R
  </text>

  <!-- Tech dots -->
  <circle cx="100" cy="30" r="2" class="tech-dot" style="animation-delay: 0.5s" />
  <circle cx="250" cy="120" r="2" class="tech-dot" style="animation-delay: 1s" />
  <circle cx="400" cy="50" r="2" class="tech-dot" style="animation-delay: 1.5s" />
  <circle cx="550" cy="100" r="2" class="tech-dot" style="animation-delay: 2s" />
  <circle cx="700" cy="30" r="2" class="tech-dot" style="animation-delay: 2.5s" />
</svg>

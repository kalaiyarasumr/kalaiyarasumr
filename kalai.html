<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kalaiyarasu Tech Lightning SVG</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #0f172a;
    }
    svg {
      display: block;
      margin: auto;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="grid-bg" d="M 0 0 L 0 40 M 0 0 L 40 0" />
    </pattern>

    <style>
      .text {
        font: 700 48px 'Poppins', sans-serif;
        fill: url(#grad);
        letter-spacing: 1px;
        animation: pulse 2s infinite ease-in-out, float 3s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { text-shadow: 0 0 8px rgba(37, 99, 235, 0.5); }
        50% { text-shadow: 0 0 15px rgba(124, 58, 237, 0.7); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      .tech-dot {
        fill: #3b82f6;
        opacity: 0;
        animation: dot-appear 4s infinite, pulse-dot 2s infinite alternate;
      }

      @keyframes dot-appear {
        0%, 75% { opacity: 0; transform: scale(0.3); }
        25%, 50% { opacity: 0.8; transform: scale(1); }
      }

      @keyframes pulse-dot {
        0%, 100% { r: 2; }
        50% { r: 3.5; }
      }

      .circuit-line {
        stroke: #3b82f6;
        stroke-width: 1;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        opacity: 0.3;
        animation: draw 3s linear infinite;
      }

      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }

      .grid-bg {
        stroke: #3b82f6;
        stroke-width: 0.3;
        stroke-dasharray: 5;
        opacity: 0.1;
        animation: grid-move 20s linear infinite;
      }

      @keyframes grid-move {
        to { stroke-dashoffset: 100; }
      }
    </style>
  </defs>

  <!-- Grid Background -->
  <rect width="100%" height="100%" fill="#0f172a" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Circuit Lines -->
  <path class="circuit-line" d="M50,20 L200,20" />
  <path class="circuit-line" d="M600,130 L750,130" style="animation-delay: 0.5s" />
  <path class="circuit-line" d="M400,40 L400,90" style="animation-delay: 1s" />

  <!-- Name Text -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" class="text">
    KALAIYARASU M R
  </text>

  <!-- Tech Dots -->
  <circle cx="100" cy="30" r="2" class="tech-dot" style="animation-delay: 0.3s" />
  <circle cx="250" cy="120" r="2" class="tech-dot" style="animation-delay: 0.6s" />
  <circle cx="400" cy="50" r="2" class="tech-dot" style="animation-delay: 0.9s" />
  <circle cx="550" cy="100" r="2" class="tech-dot" style="animation-delay: 1.2s" />
  <circle cx="700" cy="30" r="2" class="tech-dot" style="animation-delay: 1.5s" />
</svg>

</body>
</html>
